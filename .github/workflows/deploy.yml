name: Deploy NeuroScan AI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_KEY" | base64 --decode > key.pem
          chmod 400 key.pem
          scp -o StrictHostKeyChecking=no -i key.pem application.py ubuntu@$EC2_HOST:~/neuroscan/
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST "cd ~/neuroscan && docker stop neuroscan-app || true && docker rm neuroscan-app || true && docker build -t neuroscan-ai . && docker run -d --name neuroscan-app --restart always -p 8000:8000 neuroscan-ai && echo Done"
