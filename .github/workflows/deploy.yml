name: Deploy NeuroScan AI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/neuroscan
            docker stop neuroscan-app || true
            docker rm neuroscan-app || true
            docker build -t neuroscan-ai .
            docker run -d --name neuroscan-app --restart always -p 8000:8000 neuroscan-ai
            echo "Deployment complete!"
