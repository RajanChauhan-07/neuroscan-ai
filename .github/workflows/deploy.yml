name: Deploy NeuroScan AI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 400 key.pem

          scp -o StrictHostKeyChecking=no -i key.pem \
            application.py ubuntu@$EC2_HOST:~/neuroscan/

          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@$EC2_HOST << 'ENDSSH'
            cd ~/neuroscan
            docker stop neuroscan-app 2>/dev/null || true
            docker rm neuroscan-app 2>/dev/null || true
            docker build -t neuroscan-ai .
            docker run -d \
              --name neuroscan-app \
              --restart always \
              -p 8000:8000 \
              neuroscan-ai
            echo "Deployment complete!"
ENDSSH
