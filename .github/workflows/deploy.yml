name: Deploy NeuroScan AI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/deploy_key application.py ubuntu@${{ secrets.EC2_HOST }}:~/neuroscan/
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} "cd ~/neuroscan && docker stop neuroscan-app || true && docker rm neuroscan-app || true && docker build -t neuroscan-ai . && docker run -d --name neuroscan-app --restart always -p 8000:8000 neuroscan-ai && echo Done"
